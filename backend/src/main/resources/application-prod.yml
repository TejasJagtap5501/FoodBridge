# Production profile.
# Secrets must come from the environment; the app fails fast if JWT_SECRET is missing.
spring:
  jpa:
    properties:
      hibernate:
        format_sql: false
  flyway:
    clean-disabled: true
foodbridge:
  security:
    cookie-secure: ${COOKIE_SECURE:true}
    cookie-same-site: ${COOKIE_SAME_SITE:None}
    # Never echo reset tokens in production - they are delivered by email.
    expose-reset-token: false
  seed:
    demo-data: ${SEED_DEMO_DATA:false}
logging:
  level:
    root: WARN
    com.foodbridge: INFO
    org.springframework.web: WARN
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
server:
  error:
    include-message: never
    include-stacktrace: never
